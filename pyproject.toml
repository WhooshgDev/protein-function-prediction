[project]
name = "pfp-cafa5"
version = "0.1.0"
description = "Protein Function Prediction on CAFA 5 (ESM-2 + hierarchical loss + taxonomy)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7.0",
    "transformers>=4.35.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0",
    "biopython>=1.81",
    "obonet>=1.0.0",
    "networkx>=3.2.1",
    "matplotlib>=3.8",
    "cafaeval>=1.3.0",
]

[dependency-groups]
dev = ["pytest>=7.4.0", "python-docx>=1.1"]

# RTX 50-series (Blackwell, sm_120) needs CUDA 12.8+ wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
