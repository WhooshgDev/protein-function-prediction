seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  embedding_dir: data/embeddings
  split: cluster
  val_ratio: 0.2
model:
  esm_name: facebook/esm2_t30_150M_UR50D
  freeze_esm: true
  pooling: mean_residue
  max_length: 1022
  max_length_policy: truncate
  hidden_dim: 512
  dropout: 0.3
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 256
  epochs: 20
  early_stopping_patience: 4
loss:
  type: bce_with_logits
  hierarchical_lambda: 0.1
taxonomy:
  enabled: true
  embedding_dim: 64
  fusion_type: concat
evaluation:
  aspects: [F, P, C]
  threshold_min: 0.01
  threshold_max: 0.99
  threshold_steps: 99
